<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f766e">
  <title>Clean N Fresh | Laundry Billing</title>
  <style>
    :root { --primary:#0f766e; --primary-dark:#115e59; --accent:#f59e0b; --bg:#f0fdfa; --card:#fff; --text:#16302b; --muted:#64748b; --line:#dbe7e5; --danger:#dc2626; --shadow:0 18px 50px rgba(15,118,110,.14); }
    body.dark { --bg:#0b1516; --card:#132223; --text:#e5f5f2; --muted:#9bb2ae; --line:#29403e; --shadow:0 18px 50px rgba(0,0,0,.3); }
    * { box-sizing:border-box; }
    body { margin:0; padding:18px; color:var(--text); background:linear-gradient(135deg,var(--bg),#e0f2fe); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; transition:.25s; }
    body.dark { background:linear-gradient(135deg,#0b1516,#102a2b); }
    .app { max-width:980px; margin:auto; }
    .topbar { display:flex; justify-content:space-between; align-items:center; gap:14px; margin-bottom:18px; }
    .brand { display:flex; align-items:center; gap:12px; }
    .logo { width:48px; height:48px; display:grid; place-items:center; border-radius:15px; color:#fff; font-size:25px; background:linear-gradient(135deg,var(--primary),#14b8a6); box-shadow:0 8px 20px rgba(15,118,110,.25); }
    h1 { margin:0; font-size:clamp(21px,4vw,30px); letter-spacing:-.5px; } .tagline { color:var(--muted); font-size:13px; margin-top:3px; }
    .icon-btn,.btn { border:0; border-radius:10px; cursor:pointer; font-weight:700; transition:.2s; } .icon-btn { width:42px; height:42px; background:var(--card); color:var(--text); box-shadow:var(--shadow); font-size:18px; } .icon-btn:hover,.btn:hover { transform:translateY(-1px); }
    .layout { display:grid; grid-template-columns:minmax(0,1.25fr) minmax(300px,.75fr); gap:18px; }
    .card { background:var(--card); border:1px solid rgba(148,163,184,.2); border-radius:20px; padding:22px; box-shadow:var(--shadow); }
    .card h2 { margin:0 0 4px; font-size:18px; } .section-note { color:var(--muted); font-size:12px; margin-bottom:15px; }
    label { display:block; margin:14px 0 6px; color:var(--muted); font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; }
    input,select { width:100%; padding:12px 13px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--text); font:inherit; outline:none; } input:focus,select:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(20,184,166,.15); }
    .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; } .customer-row { display:grid; grid-template-columns:1fr 150px; gap:10px; }
    .btn { padding:12px 15px; color:#fff; background:var(--primary); } .btn:hover { background:var(--primary-dark); } .btn.full { width:100%; margin-top:14px; } .btn.secondary { color:var(--primary); background:#ccfbf1; } .btn.warning { background:var(--accent); } .btn.dark { background:#334155; }
    .service-tabs { display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:5px; background:var(--bg); border-radius:12px; margin:16px 0; } .service-tabs button { padding:10px; border:0; border-radius:8px; background:transparent; color:var(--muted); font-weight:800; cursor:pointer; } .service-tabs button.active { color:var(--primary); background:var(--card); box-shadow:0 2px 8px rgba(0,0,0,.08); }
    .table-wrap { overflow-x:auto; } table { width:100%; border-collapse:collapse; margin-top:18px; font-size:13px; } th,td { padding:11px 8px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap; } th { color:var(--muted); font-size:11px; text-transform:uppercase; } .del-btn { color:var(--danger); cursor:pointer; font-weight:900; text-align:center; }
    .empty { color:var(--muted); text-align:center; padding:22px 8px; }
    .summary { position:sticky; top:18px; } .summary-head { display:flex; justify-content:space-between; align-items:start; } .bill-no { color:var(--muted); font-size:12px; } .summary-total { display:flex; justify-content:space-between; align-items:end; padding:18px 0; margin-top:15px; border-top:1px solid var(--line); border-bottom:1px solid var(--line); } .summary-total strong { color:var(--primary); font-size:32px; } .summary-line { display:flex; justify-content:space-between; padding:6px 0; color:var(--muted); font-size:14px; } .summary-line.discount { color:#16a34a; }
    .actions { display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:15px; } .actions .btn { font-size:13px; } .saved { margin-top:18px; padding-top:16px; border-top:1px solid var(--line); } .saved select { margin-top:7px; }
    .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px); opacity:0; pointer-events:none; background:#16302b; color:#fff; padding:11px 16px; border-radius:10px; font-size:13px; transition:.25s; z-index:5; } .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
    @media(max-width:760px) { body { padding:10px; } .layout { grid-template-columns:1fr; } .summary { position:static; } .customer-row { grid-template-columns:1fr; } .card { padding:16px; border-radius:16px; } }
    @media(max-width:420px) { .grid-2 { grid-template-columns:1fr; } .actions { grid-template-columns:1fr; } }
    @media print { body { padding:0; background:#fff; } .topbar,.entry-card,.actions,.saved,.no-print { display:none!important; } .layout { display:block; } .card { box-shadow:none; border:0; padding:0; } .summary { display:block; } .summary-total strong { color:#000; } }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand"><div class="logo">✦</div><div><h1>CLEAN N FRESH</h1><div class="tagline">Laundry & Dry Cleaning • Smart Billing</div></div></div>
      <button class="icon-btn" onclick="toggleTheme()" title="Toggle dark mode" aria-label="Toggle dark mode">◐</button>
    </header>

    <div class="layout">
      <section class="card entry-card">
        <h2>Create New Bill</h2><div class="section-note">Add services and share a professional bill with your customer.</div>
        <label>Customer details</label>
        <div class="customer-row"><input id="custName" placeholder="Customer name"><input id="custPhone" type="tel" inputmode="numeric" placeholder="Mobile number"></div>
        <button class="btn secondary full" onclick="saveCustomer()">＋ Save customer</button>

        <div class="service-tabs"><button id="pcTab" class="active" onclick="setMode('Per Pc')">Per Piece</button><button id="kgTab" onclick="setMode('Per Kg')">By Weight</button></div>
        <div id="pcSection">
          <label>Item category</label><select id="itemSelect">
            <optgroup label="Gents Wear"><option value="Shirt / T-Shirt|20|30|60|10">Shirt / T-Shirt</option><option value="Pant / Trouser / Jeans|20|30|60|10">Pant / Trouser / Jeans</option><option value="Kurta Pyjama (Set)|50|70|100|20">Kurta Pyjama (Set)</option><option value="Blazer / Coat|0|50|150|50">Blazer / Coat</option><option value="Suit (2 Pc / 3 Pc)|0|70|220|70">Suit (2 Pc / 3 Pc)</option><option value="Jacket / Sweater|0|40|120|30">Jacket / Sweater</option></optgroup>
            <optgroup label="Ladies Wear"><option value="Top / Kurti|20|30|50|10">Top / Kurti</option><option value="Dress / Frock|50|70|100|20">Dress / Frock</option><option value="Saree (Cotton/Normal)|60|90|120|30">Saree (Cotton/Normal)</option><option value="Saree (Silk/Heavy/Zari)|0|100|250|100">Saree (Silk/Heavy/Zari)</option><option value="Lehenga (Heavy)|0|150|450|150">Lehenga (Heavy)</option></optgroup>
            <optgroup label="Household & Bedding"><option value="Bedsheet Single|100|120|100|40">Bedsheet Single</option><option value="Bedsheet Double|140|160|140|50">Bedsheet Double</option><option value="Blanket Single (1 Ply)|200|200|200|0">Blanket Single (1 Ply)</option><option value="Blanket Double (2 Ply)|400|400|400|0">Blanket Double (2 Ply)</option><option value="Curtain (Per Panel)|60|80|100|30">Curtain (Per Panel)</option></optgroup>
          </select>
          <div class="grid-2"><div><label>Service type</label><select id="pcService"><option value="0">Wash & Fold</option><option value="1">Wash & Iron</option><option value="2">Dry Clean</option><option value="3">Steam Press Only</option></select></div><div><label>Quantity</label><input id="itemQty" type="number" min="1" value="1"></div></div>
          <button class="btn full" onclick="addPcItem()">＋ Add item to bill</button>
        </div>
        <div id="kgSection" hidden><div class="grid-2"><div><label>Kg service</label><select id="kgService"><option value="Wash & Fold|70">Wash & Fold (₹70/kg)</option><option value="Wash & Iron|90">Wash & Iron (₹90/kg)</option><option value="Premium Wash|120">Premium Wash (₹120/kg)</option></select></div><div><label>Weight (minimum 3 kg)</label><input id="weightQty" type="number" min="0.5" step="0.5" placeholder="e.g. 4.5"></div></div><button class="btn full" onclick="addKgItem()">＋ Add weight order</button></div>

        <div class="table-wrap"><table><thead><tr><th>Item</th><th>Service</th><th>Qty</th><th>Total</th><th></th></tr></thead><tbody id="cartTable"><tr><td colspan="5" class="empty">No items added yet</td></tr></tbody></table></div>
      </section>

      <aside class="card summary" id="invoice">
        <div class="summary-head"><div><h2>Bill Summary</h2><div class="bill-no" id="billNo"></div></div><span>🧺</span></div>
        <div id="customerPreview" class="section-note" style="margin-top:18px">Valued Customer</div>
        <div class="summary-line"><span>Subtotal</span><b id="subtotal">₹0</b></div>
        <div class="grid-2 no-print"><div><label>Discount (%)</label><input id="discount" type="number" min="0" max="100" value="0" oninput="updateTable()"></div><div><label>Payment</label><select id="payment"><option>Pending</option><option>Paid</option><option>Cash</option><option>UPI</option></select></div></div>
        <div class="summary-line discount"><span>Discount</span><b id="discountAmount">− ₹0</b></div>
        <div class="summary-total"><span>Total payable</span><strong id="grandTotal">₹0</strong></div>
        <div class="actions no-print"><button class="btn warning" onclick="printInvoice()">🖨 Print invoice</button><button class="btn" onclick="sendWhatsApp()">📱 WhatsApp</button></div>
        <button class="btn dark full no-print" onclick="newBill()">＋ New bill</button>
        <div class="saved no-print"><label>Saved customers</label><select id="savedCustomers" onchange="loadCustomer()"><option value="">Choose a saved customer</option></select></div>
      </aside>
    </div>
  </main>
  <div id="toast" class="toast"></div>

<script>
  let cart = [], mode = 'Per Pc';
  const serviceNames = ['Wash & Fold','Wash & Iron','Dry Clean','Steam Press'];
  const money = value => '₹' + Math.round(value).toLocaleString('en-IN');
  const $ = id => document.getElementById(id);

  function setMode(next) { mode = next; $('pcSection').hidden = next !== 'Per Pc'; $('kgSection').hidden = next !== 'Per Kg'; $('pcTab').classList.toggle('active', next === 'Per Pc'); $('kgTab').classList.toggle('active', next === 'Per Kg'); }
  function addPcItem() { const data=$('itemSelect').value.split('|'), idx=Number($('pcService').value), qty=Math.max(1,parseInt($('itemQty').value)||1), rate=Number(data[idx+1]); if(!rate){ alert(data[0]+' ke liye '+serviceNames[idx]+' available nahi hai!'); return; } cart.push({name:data[0],service:serviceNames[idx],qty,total:rate*qty}); updateTable(); }
  function addKgItem() { const data=$('kgService').value.split('|'), weight=parseFloat($('weightQty').value)||0; if(weight<=0){alert('Kripya vajan (Kg) bharein!');return;} const finalWeight=Math.max(3,weight); cart.push({name:'Laundry ('+weight+' Kg)',service:data[0],qty:finalWeight+' Kg',total:Math.round(finalWeight*Number(data[1]))}); updateTable(); }
  function removeItem(index) { cart.splice(index,1); updateTable(); }
  function updateTable() { let subtotal=cart.reduce((sum,item)=>sum+item.total,0), discount=Math.min(100,Math.max(0,Number($('discount').value)||0)), discountAmount=subtotal*discount/100; $('subtotal').textContent=money(subtotal); $('discountAmount').textContent='− '+money(discountAmount); $('grandTotal').textContent=money(subtotal-discountAmount); $('customerPreview').textContent=$('custName').value.trim()||'Valued Customer'; const tbody=$('cartTable'); tbody.innerHTML=''; if(!cart.length){tbody.innerHTML='<tr><td colspan="5" class="empty">No items added yet</td></tr>';return;} cart.forEach((item,i)=>{const tr=document.createElement('tr'); [item.name,item.service,item.qty,money(item.total)].forEach(text=>{const td=document.createElement('td');td.textContent=text;tr.appendChild(td);}); const del=document.createElement('td');del.textContent='✕';del.className='del-btn';del.onclick=()=>removeItem(i);tr.appendChild(del);tbody.appendChild(tr);}); }
  function billNumber(){ return 'Bill #'+new Date().toLocaleDateString('en-IN').replaceAll('/','')+'-'+String(Date.now()).slice(-4); }
  function saveCustomer(){const name=$('custName').value.trim(),phone=$('custPhone').value.trim();if(!name||!phone){alert('Customer name aur mobile number bharein!');return;}let customers=JSON.parse(localStorage.getItem('cnfCustomers')||'[]');if(!customers.some(c=>c.phone===phone))customers.push({name,phone});localStorage.setItem('cnfCustomers',JSON.stringify(customers));populateCustomers();showToast('Customer saved');}
  function populateCustomers(){const select=$('savedCustomers'),customers=JSON.parse(localStorage.getItem('cnfCustomers')||'[]');select.innerHTML='<option value="">Choose a saved customer</option>';customers.forEach(c=>{const o=document.createElement('option');o.value=c.phone;o.textContent=c.name+' • '+c.phone;select.appendChild(o);});}
  function loadCustomer(){const phone=$('savedCustomers').value,customers=JSON.parse(localStorage.getItem('cnfCustomers')||'[]'),c=customers.find(x=>x.phone===phone);if(c){$('custName').value=c.name;$('custPhone').value=c.phone;updateTable();}}
  function sendWhatsApp(){const phone=$('custPhone').value.replace(/\D/g,''),name=$('custName').value.trim()||'Valued Customer';if(!phone||cart.length===0){alert(!phone?'Customer ka mobile number bharein!':'Pehle kam se kam 1 item add karein!');return;}const discount=Number($('discount').value)||0;let list=cart.map((x,i)=>`${i+1}. ${x.name} (${x.service}) x ${x.qty} = ${money(x.total)}`).join('\n');const msg=`*CLEAN N FRESH LAUNDRY*\n${$('billNo').textContent}\n----------------------------\n*Customer:* ${name}\n*ITEMS:*\n${list}\n----------------------------\nSubtotal: ${$('subtotal').textContent}\nDiscount: ${discount}%\n*TOTAL BILL:* ${$('grandTotal').textContent}\n*Payment:* ${$('payment').value}\n----------------------------\nThank you for choosing Clean N Fresh!`;window.open('https://wa.me/91'+phone+'?text='+encodeURIComponent(msg),'_blank');}
  function printInvoice(){if(!cart.length){alert('Pehle kam se kam 1 item add karein!');return;}window.print();}
  function newBill(){if(cart.length&&!confirm('Start a new bill?'))return;cart=[];$('custName').value='';$('custPhone').value='';$('discount').value=0;$('payment').value='Pending';$('billNo').textContent=billNumber();updateTable();showToast('New bill started');}
  function toggleTheme(){document.body.classList.toggle('dark');localStorage.setItem('cnfTheme',document.body.classList.contains('dark')?'dark':'light');}
  function showToast(text){const t=$('toast');t.textContent=text;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}
  $('custName').addEventListener('input',updateTable); $('custPhone').addEventListener('input',updateTable); $('billNo').textContent=billNumber(); populateCustomers(); if(localStorage.getItem('cnfTheme')==='dark')document.body.classList.add('dark'); updateTable();
</script>
</body>
</html>
